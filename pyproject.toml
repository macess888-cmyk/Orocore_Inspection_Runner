[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orocore-inspection-runner"
version = "0.1.0"
description = "Observer-only operational runner for the frozen Orocore inspection fabric."
requires-python = ">=3.12"

[project.scripts]
orocore = "orocore_runner.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]